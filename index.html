<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anniversary Wishes</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="page-wrapper">
    <div class="hero">
      <h1>Happy Anniversary! 🎉❤️</h1>
      <p class="subtitle">Celebrating your love, laughter, and beautiful memories.</p>
      <div class="wish-card">
        <p id="typed-text"></p>
        <button id="replay-btn">Replay Magic ✨</button>
      </div>
      <div class="emoji-row">🌹🥂💖🌟🎈</div>
    </div>

    <section class="features">
      <div class="feature">
        <div class="icon">💌</div>
        <h2>Sweet Wishes</h2>
        <p>A loving message for a timeless bond.</p>
      </div>
      <div class="feature">
        <div class="icon">✨</div>
        <h2>Soft Animations</h2>
        <p>Floating hearts, glowing lights, and confetti shimmer.</p>
      </div>
      <div class="feature">
        <div class="icon">🎶</div>
        <h2>Romantic Vibe</h2>
        <p>Styled with a dreamy gradient and playful motion.</p>
      </div>
    </section>

    <div class="heart-container" aria-hidden="true"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
